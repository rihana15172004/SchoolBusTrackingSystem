<!DOCTYPE html>
<html>
<head>
    <title>Search Student</title>
</head>
<body>

    <h1>Search Student</h1>

    <form method="POST">
        <input type="text" name="name" placeholder="Enter Student Name">
        <button type="submit">Search</button>
    </form>

    <br>

    {% if students %}

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Stop Name</th>
            <th>Parent Phone</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
        </tr>
        {% endfor %}

    </table>

    {% endif %}

</body>
</html>
