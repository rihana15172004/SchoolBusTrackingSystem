<!DOCTYPE html>
<html>
<head>
    <title>Notifications</title>
</head>
<body>

<h1>Notifications</h1>

<form method="POST">

    <input type="text" name="message" placeholder="Enter Notification">

    <button type="submit">Add Notification</button>

</form>

<br>

<table border="1">

<tr>
    <th>ID</th>
    <th>Notification</th>
    <th>Action</th>
</tr>

{% for n in notifications %}
<tr>
    <td>{{ n[0] }}</td>
    <td>{{ n[1] }}</td>
    <td>
        <a href="/delete_notification/{{ n[0] }}">
            Delete
        </a>
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
