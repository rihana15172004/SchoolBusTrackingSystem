<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
</head>
<body>

    <h1>Student List</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Stop Name</th>
            <th>Parent Phone</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>

<td>
    <a href="/delete_student/{{ student[0] }}">
        Delete
    </a>
</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
